#
# Builds mxc-exec-mac (the macOS sandbox executor) on an ARM64 macOS
# Microsoft-hosted agent and publishes the binary as a pipeline artifact.

parameters:
- name: triplet
  type: string
  default: aarch64-apple-darwin
- name: isOfficialBuild
  type: boolean
  default: false
- name: ESRPInfo
  type: object
  default: {}

jobs:
- job: 'build_arm64_MAC'
  displayName: 'Build (arm64 MAC)'

  pool:
    name: Azure Pipelines
    # macOS-14-arm64 (and later) images are Apple Silicon (arm64). macOS-latest
    # currently still points to an x86_64 image, which cannot execute the
    # cross-compiled aarch64 test binaries.
    vmImage: macOS-14-arm64
    os: macOS

  variables:
    CARGO_TARGET_DIR: $(Agent.TempDirectory)/target
    targetTriple: ${{ parameters.triplet }}
    targetTripleDir: $(CARGO_TARGET_DIR)/$(targetTriple)/release
    outputDirectory: $(Build.SourcesDirectory)/out
    artifactBaseName: mxc-binaries-$(targetTriple)
    workingDirectory: $(Build.SourcesDirectory)/src
    configTomlPath: $(Build.SourcesDirectory)/.cargo/config.toml
    # Mac builds a small subset of the workspace (the Windows-only crates
    # would not compile on macOS). Keep these in sync with the inline clippy
    # invocation below.
    macPackages: 'mxc_darwin seatbelt_common wxc_common'

  # On official builds, declare templateContext.rust so 1ES PT injects the
  # companion Rust workflow (toolchain install, cargo cache, SBOM emit into
  # RustBuildEvidence artifact). Fork PRs arrive as Unofficial and the
  # injected steps would fail (no System.AccessToken), so the unofficial
  # path uses plain rustup + cargo instead.
  ${{ if eq(parameters.isOfficialBuild, true) }}:
    templateContext:
      rust:
        rustToolchain:
          toolchainFeed: https://microsoft.pkgs.visualstudio.com/Dart/_packaging/Mxc-Azure-Feed/nuget/v3/index.json
          version: 'ms-prod-1.93'
          additionalTargets: $(targetTriple)
        workingDirectory: $(workingDirectory)
        authenticateOptions:
          configFile: $(configTomlPath)
        installOptions:
          configFile: $(configTomlPath)
        cacheOptions:
          enabled: true
          enableTargetCache: true

  steps:
    - checkout: self

    # Install Rust toolchain first so fmt/clippy below have a cargo to use.
    # (On official, templateContext.rust above auto-injects the toolchain
    # install; this template ref only runs on the unofficial path.)
    - ${{ if not(eq(parameters.isOfficialBuild, true)) }}:
      - template: Rust.Build.Steps.Unofficial.yml@self
        parameters:
          targetTriple: $(targetTriple)

    - script: cargo fmt --all -- --check
      displayName: Check formatting
      workingDirectory: $(workingDirectory)

    # Clippy is scoped to the macOS-specific crates because the full
    # workspace includes Windows-only crates that do not compile on macOS.
    - script: cargo clippy -p mxc_darwin -p seatbelt_common --target $(targetTriple) -- -D warnings
      displayName: Clippy
      workingDirectory: $(workingDirectory)

    - ${{ if eq(parameters.isOfficialBuild, true) }}:
      # Toolchain + cargo cache are wired by templateContext.rust above.
      # 1ES.Build.Rust.Run runs build + test and emits the SBOM into
      # RustBuildEvidence_<triplet>_release.
      - task: 1ES.Build.Rust.Run@1
        displayName: Build (1ES)
        inputs:
          command: build
          profile: release
          target: $(targetTriple)
          packages: $(macPackages)
          enableTest: true
          publishTestResults: false
          enableClippy: false
          enableCodeStyleCheck: false
          checkAllCodeStyle: false
          useNextest: false
          testAllTargets: false
          buildAllTargets: false
          allFeatures: false

    - ${{ else }}:
      - script: cargo build --locked --release --target $(targetTriple) -p mxc_darwin
        displayName: Build release
        workingDirectory: $(workingDirectory)

      - script: cargo test --locked --release --target $(targetTriple) -p mxc_darwin -p seatbelt_common -p wxc_common
        displayName: Run tests
        workingDirectory: $(workingDirectory)

    # --- macOS Code Signing + Notarization (official builds only) ---
    # ESRP handles the full signing flow using Microsoft's Developer ID
    # certificate (CP-401337-Apple). No local cert or codesign needed.
    #
    # ESRP's Mac signing requires a .zip (or .dmg) input — raw Mach-O
    # binaries are rejected. We zip before signing and unzip afterward.
    #
    # Flow: (1) zip → (2) ESRP sign (hardened runtime) → (3) ESRP notarize → (4) unzip
    # Stapling is impossible for standalone Mach-O binaries (Apple limitation);
    # Gatekeeper checks the notarization ticket online instead.
    - script: |
        cd "$(targetTripleDir)"
        zip mxc-exec-mac.zip mxc-exec-mac
      displayName: 'Zip binary for ESRP signing'
      condition: and(succeeded(), eq(${{ parameters.isOfficialBuild }}, true))

    - task: EsrpCodeSigning@5
      displayName: 'Sign macOS binary (ESRP)'
      condition: and(succeeded(), eq(${{ parameters.isOfficialBuild }}, true))
      inputs:
        ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
        AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
        AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
        AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
        AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
        AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
        FolderPath: $(targetTripleDir)
        Pattern: mxc-exec-mac.zip
        UseMinimatch: true
        signConfigType: 'inlineSignParams'
        inlineOperation: >-
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppDeveloperSign",
              "Parameters": {
                "Hardening": "--options=runtime"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - task: EsrpCodeSigning@5
      displayName: 'Notarize macOS binary (ESRP)'
      condition: and(succeeded(), eq(${{ parameters.isOfficialBuild }}, true))
      inputs:
        ConnectedServiceName: ${{ parameters.ESRPInfo.serviceName }}
        AppRegistrationClientId: ${{ parameters.ESRPInfo.clientId }}
        AppRegistrationTenantId: ${{ parameters.ESRPInfo.tenantId }}
        AuthAKVName: ${{ parameters.ESRPInfo.azureKeyVaultName }}
        AuthCertName: ${{ parameters.ESRPInfo.authCertName }}
        AuthSignCertName: ${{ parameters.ESRPInfo.signCertName }}
        FolderPath: $(targetTripleDir)
        Pattern: mxc-exec-mac.zip
        UseMinimatch: true
        signConfigType: 'inlineSignParams'
        inlineOperation: >-
          [
            {
              "KeyCode": "CP-401337-Apple",
              "OperationCode": "MacAppNotarize",
              "Parameters": {
                "BundleId": "com.microsoft.mxc"
              },
              "ToolName": "sign",
              "ToolVersion": "1.0"
            }
          ]

    - script: |
        cd "$(targetTripleDir)"
        unzip -o mxc-exec-mac.zip
        rm mxc-exec-mac.zip
      displayName: 'Unzip signed binary'
      condition: and(succeeded(), eq(${{ parameters.isOfficialBuild }}, true))

    - task: CopyFiles@2
      displayName: Copy binary
      inputs:
        sourceFolder: $(targetTripleDir)
        contents: mxc-exec-mac
        targetFolder: $(outputDirectory)/$(targetTriple)

    # Copy the .dSYM bundle into a sibling `symbols/` subdir, mirroring the
    # Windows/Linux pattern (see Rust.Build.Job.yml for the BinSkim rationale).
    - task: CopyFiles@2
      displayName: Copy dSYM bundle
      inputs:
        sourceFolder: $(targetTripleDir)
        contents: 'mxc-exec-mac.dSYM/**'
        targetFolder: $(outputDirectory)/$(targetTriple)/symbols

    - task: 1ES.PublishPipelineArtifact@1
      displayName: Publish
      inputs:
        path: '$(outputDirectory)/$(targetTriple)'
        artifactName: $(artifactBaseName)
