#
# Unofficial / fork-PR Rust toolchain setup: public crates.io, no auth tasks.
# (Fork PRs against a public upstream lose System.AccessToken, so any task that
# defaults its authenticationToken to $(System.AccessToken) fails at prep time.)

parameters:
- name: targetTriple
  type: string
- name: rustVersion
  type: string
  default: 'ms-prod-1.93'

steps:
  - task: RustInstaller@1
    displayName: Install Rust toolchain (public)
    inputs:
      rustVersion: ${{ parameters.rustVersion }}
      additionalTargets: ${{ parameters.targetTriple }}
